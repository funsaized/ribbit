name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install supported picker (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Tagged sources require the release linker flags (see upstream v0.74.3 Makefile).
          go install -ldflags "-X main.version=0.74.3 -X main.revision=v0.74.3" github.com/junegunn/fzf@v0.74.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install supported picker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install -ldflags "-X main.version=0.74.3 -X main.revision=v0.74.3" github.com/junegunn/fzf@v0.74.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check installed picker version
        run: bun run scripts/ci-picker.ts
      - name: Verify native candidate
        run: bun run verify
      - name: Package and verify installed archive
        run: |
          bun run package:release
          bun run package:verify
      - name: Verify npm installation
        run: bun run package:npm:verify
      - name: Preserve verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: ribbit-${{ matrix.target }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
